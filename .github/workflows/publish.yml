name: Publish images

# Builds the four service images from the shared parameterized Dockerfile and
# pushes them to GHCR. The home deployment (HomeInfra docker/code-exploder)
# pulls :latest; :sha-<commit> tags allow pinning/rollback.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: CodeExploder.Gateway
            image: code-exploder-gateway
          - project: CodeExploder.Workers.Analysis
            image: code-exploder-worker-analysis
          - project: CodeExploder.Workers.Llm
            image: code-exploder-worker-llm
          - project: CodeExploder.Orchestrator
            image: code-exploder-orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning needs full history (the Dockerfile copies .git).
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; the repository owner isn't.
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            PROJECT=${{ matrix.project }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
